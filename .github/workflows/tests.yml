name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # The full install is used, with the CPU build of torch, so that the training-loop and
      # ONNX-export tests run instead of being skipped. Those tests check the parts most likely
      # to break when a dependency changes. The CPU build keeps the download small; installing
      # torch first means requirements.txt (which lists torch without a version) keeps it.
      - name: Install CPU-only torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # One test reads a local detection cache under runs/, which is not tracked by git,
      # so it is skipped here.
      - name: Run pytest
        run: python -m pytest -q

      # Every committed notebook (five Colab, three Kaggle editions with their metadata and declaration) must
      # match a fresh build from the generator, each with its variant's own base-model revision.
      - name: Check the generated notebooks
        run: python tools/build_notebook.py --check-all

      # The app's golden fixtures must match a fresh build from the Python reference (Pillow is pinned
      # because resize output differs between versions).
      - name: Check the app's golden fixtures
        run: |
          python -m tools.export_app_fixtures --check
          python app/tool/export_resize_fixtures.py --check

  lean:
    name: Lean proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain named in formal/lean-toolchain and runs `lake build`, which fails on any
      # proof that does not check, on `sorry` (formal/lakefile.toml sets warningAsError), and on any
      # axiom beyond Lean's standard three (formal/AxiomAudit.lean). No Mathlib: core library only.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          use-mathlib-cache: false

      # The Python and Dart tests check the real code against these fixtures, so they must match a fresh
      # run of the proved specification.
      - name: Check the Lean fixtures
        run: lake exe fixtures --check

  app:
    name: Flutter app tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      # Unit and widget tests in app/test only. integration_test needs a device or emulator.
      - name: Run tests
        run: flutter test
