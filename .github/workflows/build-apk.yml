name: Build APK

# Builds an installable Android APK of the demo app. Every run uploads the APK as a workflow
# artifact. Pushing a tag such as app-v1.0.0 also attaches it to a GitHub Release, so a phone
# can download it directly. Tag builds are signed with the project's release key, read from
# repository secrets, so a newer release installs over an older one; they fail if the secrets
# are missing. Other runs (pull requests, manual runs) are signed with the debug key (see
# app/android/app/build.gradle.kts), which is fine for trying an APK but not for updating one.

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Write the release key
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release must be signed with the release key"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # One APK per CPU type keeps each file small. Most phones need the arm64-v8a one.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rice-pest-detector-apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  release:
    name: Attach APK to release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rice-pest-detector-apk

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "*-release.apk"
