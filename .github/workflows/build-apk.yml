name: Build APK

# Builds an installable Android APK of the demo app. Every run uploads the APK as a workflow
# artifact. Pushing a tag such as app-v1.0.0 also attaches it to a GitHub Release, so a phone
# can download it directly. The release build is signed with the debug key (see
# app/android/app/build.gradle.kts), which is fine for side-loading but not for Play Store.

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      # One APK per CPU type keeps each file small. Most phones need the arm64-v8a one.
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v5
        with:
          name: rice-pest-detector-apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  release:
    name: Attach APK to release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rice-pest-detector-apk

      - uses: softprops/action-gh-release@v2
        with:
          files: "*-release.apk"
