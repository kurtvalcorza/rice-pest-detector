[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-pest-detector"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["numpy==2.5.4", "pillow==12.3.0"]  # pinned: data/ and the app fixtures were built with these; Pillow's resize output differs in 13.0

[project.optional-dependencies]
train = ["torch", "transformers==5.20.1", "pycocotools>=2.0.8", "scipy>=1.11"]  # >= 5.18 fixes the RT-DETR denoising-loss bug
export = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8", "ruff>=0.5", "pycocotools>=2.0.8", "nbformat>=5.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
markers = ["torch: needs torch + transformers", "onnx: needs onnx + onnxruntime"]

[tool.ruff]
line-length = 110
